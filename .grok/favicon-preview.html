<!doctype html>
<html>
<head>
  <style>
    html, body { margin: 0; background: #6b6b6b; }
    .row { display: flex; gap: 24px; padding: 24px; align-items: end; }
    figure { margin: 0; color: #fff; font: 12px/1.3 sans-serif; text-align: center; }
    img { display: block; image-rendering: pixelated; background: transparent; }
  </style>
</head>
<body>
  <div class="row">
    <figure>
      <img src="file:///workspace/public/favicon.svg" width="16" height="16" alt="16">
      <figcaption>16px</figcaption>
    </figure>
    <figure>
      <img src="file:///workspace/public/favicon.svg" width="32" height="32" alt="32">
      <figcaption>32px</figcaption>
    </figure>
    <figure>
      <img src="file:///workspace/public/favicon.svg" width="64" height="64" alt="64">
      <figcaption>64px</figcaption>
    </figure>
  </div>
</body>
</html>
